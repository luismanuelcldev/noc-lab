# Override para Docker Desktop (Windows y macOS). No se usa en Linux, donde el
# docker-compose.yml de la raiz ya es correcto.
#
#     docker compose -f docker-compose.yml -f docker-compose.desktop.yml up -d
#     make up-desktop
#
# Lo unico que cambia es la propagacion de montajes de node-exporter. En Linux la
# raiz del host se monta con "rslave", para que los discos que aparezcan mas tarde
# se propagen al contenedor en lugar de dejar un arbol congelado en el arranque.
# Docker Desktop no puede: su VM de Linux no es un montaje compartido y el demonio
# aborta el contenedor con "path / is mounted on / but it is not a shared or slave
# mount". No hay opcion para propagar.
#
# Lo que se pierde, y por que lo acepto en un laboratorio: dentro del contenedor "/"
# es el sistema de ficheros de la VM, no Windows ni macOS, asi que las metricas de
# disco, memoria y CPU describen la VM; y sin rslave, los montajes posteriores al
# arranque no se propagan. En un servidor Linux el segundo punto importa al cambiar
# discos en caliente, y por eso el fichero de la raiz conserva rslave. Un despliegue
# real vigila el nodo con node-exporter en el host, no dentro de Docker Desktop; ver
# docs/INSTALL.md y el limite que anota docs/PROJECT.md.

services:

  node-exporter:
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro          # sin "rslave": ver la nota de arriba
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/credentials/.+)($$|/)|^/(run/desktop/.+|parent-distro.*|.*/wslg/.*)($$|/)
      - --collector.filesystem.fs-types-exclude=^(9p|drvfs|rootfs|autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
      # --collector.systemd se deja fuera: Docker Desktop no tiene systemd y el
      # colector solo produciria ruido. En Linux sigue activado.
      - --collector.processes
      - --collector.udp_queues