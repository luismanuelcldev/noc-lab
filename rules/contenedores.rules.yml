# Contenedores: uso de CPU, memoria y reinicios.
# Validar: promtool check rules rules/contenedores.rules.yml
#
# SOBRE LAS ETIQUETAS. cAdvisor NO publica una etiqueta "container_name" (comprobado
# contra la v0.55.1 real); se usa "name", la única estable y legible en Docker y en
# Kubernetes. El fallo es mudo: promtool lo acepta, la interfaz lo muestra sin quejarse
# y la alerta sencillamente nunca dispara. Una alerta muerta es peor que no tenerla.
groups:
  - name: contenedores
    rules:
      # MISMA TRAMPA DE UNIDADES que CPUHostAlta: rate() sobre un contador de segundos
      # de CPU devuelve NÚCLEOS, así que 0.80 son 0.8 núcleos y no un 80%. Como porcentaje
      # del límite haría falta container_spec_cpu_quota sobre
      # container_spec_cpu_period, que obliga a tratar limit=0 y divide por cero.
      # Decisión: núcleos absolutos, simple y sin falsos negativos.
      # Sin filtro mode!="idle": bajo cgroup v2 las métricas de contenedor no tienen esa
      # etiqueta (la que hay es cpu="total"); en node-exporter sí existe y se conserva.
      - alert: ContenedorUsoCPUAlto
        expr: |
          sum by (name) (
            rate(container_cpu_usage_seconds_total{job="cadvisor", name!=""}[2m])
          ) > 0.80
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.name }}"
        annotations:
          summary: "El contenedor {{ $labels.name }} usa {{ $value | printf \"%.2f\" }} núcleos"
          description: "Uso sostenido por encima de 0.8 núcleos de CPU durante 5 minutos. Ojo con las unidades: esta métrica va en NÚCLEOS, no en porcentaje. Para el porcentaje del límite del contenedor, mira el dashboard de contenedores."
          runbook_url: "https://github.com/luismanuelcldev/noc-lab/blob/main/docs/RUNBOOK.md#contenedor-cpu-alto"
          dashboard_url: "http://localhost:3000/d/noc-contenedores-detalle"

      # working_set_bytes es la cifra comparable con el límite, y se multiplica por 100
      # para trabajar en porcentaje. EL FILTRO "> 0" NO ES OPCIONAL: cAdvisor publica
      # limit = 0 para todo contenedor sin límite, y medido en este stack los están
      # TODOS. working_set / 0 es +Inf, +Inf > 90 siempre es cierto y las alertas de
      # contenedor quedan siempre disparadas: un tablero rojo solo enseña a ignorar el
      # sistema. Sin límite no hay porcentaje, y no entrar es lo correcto.
      - alert: ContenedorUsoMemoriaAlto
        expr: |
          (
            max by (name) (
              container_memory_working_set_bytes{job="cadvisor", name!=""}
            )
              / on(name)
            max by (name) (
              container_spec_memory_limit_bytes{job="cadvisor", name!=""} > 0
            )
          ) * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.name }}"
        annotations:
          summary: "El contenedor {{ $labels.name }} está al {{ $value | printf \"%.1f\" }}% de su límite de memoria"
          description: "Working set por encima del 90% del límite asignado. Pasado el 100% el kernel lo mata de inmediato (OOM kill)."
          runbook_url: "https://github.com/luismanuelcldev/noc-lab/blob/main/docs/RUNBOOK.md#contenedor-memoria-alto"
          dashboard_url: "http://localhost:3000/d/noc-contenedores-resumen"

      # increase(container_last_seen[10m]) estaba mal: container_last_seen NO es un
      # contador, es un reloj que avanza mientras el contenedor vive, así que increase()
      # da ~0 y la regla no detectaba ni un reinicio. Era decoración que parecía
      # funcionar. container_start_time_seconds sí cambia al arrancar, y changes() cuenta
      # cuántas veces. El umbral es 2 y no 1 porque la aparición de la serie ya cuenta
      # como un cambio: distingue "arrancó una vez" de "está en bucle de fallos".
      - alert: ContenedorReiniciado
        expr: changes(container_start_time_seconds{job="cadvisor", name!=""}[10m]) >= 2
        for: 2m
        labels:
          severity: warning
          service: "{{ $labels.name }}"
        annotations:
          summary: "El contenedor {{ $labels.name }} se reinició varias veces en 10 minutos"
          description: "Dos o más arranques en 10 minutos. Síntoma clásico de bucle de fallos: la causa suele estar en el log del contenedor, no en los recursos."
          runbook_url: "https://github.com/luismanuelcldev/noc-lab/blob/main/docs/RUNBOOK.md#contenedor-reiniciado"
          dashboard_url: "http://localhost:3000/d/noc-contenedores-detalle"
