# Agrupa, silencia y reparte las alertas a los receptores.
services:
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: noc-alertmanager
    extends:
      file: ./_base.yml
      service: default
    networks: [edge, mesh]
    ports:
      - "${NOC_BIND_ADDRESS:-127.0.0.1}:9093:9093"
    volumes:
      - ../alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../docker/alertmanager-entrypoint.sh:/usr/local/bin/render-config.sh:ro
      - alertmanager-data:/alertmanager
    environment:
      # Consumida por docker/alertmanager-entrypoint.sh para inyectar la cabecera
      # Authorization en los webhooks: Alertmanager no expande variables de entorno.
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
    # tmpfs para el fichero renderizado, que contiene el token: en memoria y fuera
    # de la capa del contenedor.
    tmpfs:
      - /tmp:size=8M,mode=1777
    entrypoint: ["/bin/sh", "/usr/local/bin/render-config.sh"]
    command:
      - --config.file=/tmp/alertmanager.rendered.yml
      - --storage.path=/alertmanager   # sin esto se pierden los silencios
      - --web.listen-address=0.0.0.0:9093
      - --log.level=info
      - --log.format=logfmt
    depends_on:
      ntfy-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M