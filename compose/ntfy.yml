# Servidor de notificaciones autoalojado.
services:
  # No uso el ntfy.sh publico: mandar alertas internas a un tercero es una fuga, y
  # sin autenticacion el topic es publico y adivinable.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: noc-ntfy
    extends:
      file: ./_base.yml
      service: default
    # `serve` es obligatorio: el entrypoint de la imagen solo llama a `ntfy`, asi que
    # sin este subcomando imprime la ayuda y sale con 0, y el contenedor se queda
    # "restarting" sin error en el log: lo que se ve ES la ayuda.
    command: ["serve"]
    networks: [edge, mesh]
    ports:
      # Puerto no estandar a proposito: evita chocar con un ntfy del host.
      - "${NOC_BIND_ADDRESS:-127.0.0.1}:8085:80"
    environment:
      # URL que ntfy incrusta en los enlaces que genera. Tiene que ser alcanzable
      # desde donde se LEE la notificacion, no desde donde se envia: en un movil es
      # la IP de la LAN, porque "localhost" en el movil es el propio movil.
      NTFY_BASE_URL: "${NTFY_BASE_URL:-http://localhost:8085}"

      # Push de iOS para un servidor autoalojado. Lo que cruza ese limite y lo que
      # no, y por que no es una fuga, en docs/PROJECT.md.
      NTFY_UPSTREAM_BASE_URL: "${NTFY_UPSTREAM_BASE_URL:-}"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_LOG_LEVEL: info
      # Obligatorio en cuanto el puerto publicado sale de loopback: sin el, el topic
      # es publico y adivinable, y quien lo encuentre puede publicar alertas falsas.
      NTFY_ENABLE_LOGIN: "${NTFY_ENABLE_LOGIN:-false}"
      # Sin este fichero ntfy se niega a crear usuarios ("auth-file not set"). Vive
      # en el volumen para que sobrevivan a un recreate, que no debe dejar el movil
      # fuera del topic.
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      # Lo que puede hacer un cliente sin autenticar. `read-write` es el
      # comportamiento historico y solo es seguro mientras el puerto siga en
      # 127.0.0.1; `deny-all` es lo que hace que el login signifique algo.
      NTFY_AUTH_DEFAULT_ACCESS: "${NTFY_AUTH_DEFAULT_ACCESS:-read-write}"
      NTFY_ENCRYPTION: none          # en produccion: genera una clave y usa https
    volumes:
      - ntfy-data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M