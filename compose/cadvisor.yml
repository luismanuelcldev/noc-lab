# Metricas de contenedor. Requiere privileged y el host montado.
services:
  # `privileged` y el host montado son inevitables: lee metricas de cgroup del kernel.
  # Es el componente con mas superficie de ataque del stack, y el riesgo esta aceptado
  # y documentado en docs/SECURITY.md. Mitigado con montajes de solo lectura y sin
  # puerto publicado: su unico cliente es Prometheus, por la red interna.
  cadvisor:
    # v0.55.1 clavada: la mas antigua que lee contenedores con Docker 28+. Ver docs/OPERATIONS.md.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: noc-cadvisor
    privileged: true
    extends:
      file: ./_base.yml
      service: default
    networks: [mesh]
    command:
      - --docker_only=true          # omite metricas de host que duplican las de node-exporter
      - --housekeeping_interval=15s # debe ser <= scrape_interval
      - --max_housekeeping_interval=20s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          # Sin este limite los demas reportan limite 0 y su % de memoria no tiene denominador.
          memory: 384M