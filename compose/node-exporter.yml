# Metricas del host. Solo los subarboles /proc y /sys necesarios.
services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: noc-node-exporter
    extends:
      file: ./_base.yml
      service: default
    networks: [mesh]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # Seudoficheros, arboles de credenciales de Docker y rutas de WSL2/Desktop, que
      # son de solo lectura por diseno. En un servidor Linux no existen y no se oculta nada real.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/credentials/.+)($$|/)|^/(run/desktop/.+|parent-distro.*|.*/wslg/.*)($$|/)
      # Esta lista SUSTITUYE la de por defecto, asi que no se puede acortar. Ver docs/OPERATIONS.md.
      - --collector.filesystem.fs-types-exclude=^(9p|drvfs|rootfs|autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
      - --collector.systemd           # unidades systemd: estado de los servicios
      - --collector.processes         # procesos e hilos: deteccion de fugas
      # El colector se llama `udp_queues`; `udp_lite` es un nombre viejo que no arranca.
      - --collector.udp_queues
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # `:ro` a secas y no `:rslave`: la raiz del laboratorio no tiene propagacion
      # `shared`/`slave` y el daemon rechaza crear el contenedor. `/proc` y `/sys` ya
      # estan montados justo arriba, asi que no hace falta propagacion.
      - /:/host/root:ro
    healthcheck:
      # v1.12.1 ya no sirve `/-/healthy` ni `/-/ready`: ambos dan 404 y el contenedor
      # queda `unhealthy` exportando metricas buenas. `/metrics` con `build_info`
      # demuestra ademas que los colectores producen, no solo que el puerto responde.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics | grep -q '^node_exporter_build_info' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M