# grafana: Paneles. Aprovisionados desde los JSON del repositorio, nunca editados en la UI.
# Definido en este fichero e inyectado por docker-compose.yml; los anchors
# YAML no sobreviven a un include, de ahí extends en lugar de <<: *hardening.
services:


  # =========================================================================
  # 9. GRAFANA - visualisation and dashboards
  # =========================================================================
  # Datasource and dashboards are provisioned from ./grafana/provisioning, so
  # the stack comes up reproducibly with no manual step.
  grafana:
    image: grafana/grafana:12.4.11
    container_name: noc-grafana
    extends:
      file: ./_base.yml
      service: default
    networks: [edge, mesh]
    ports:
      - "${NOC_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # ":?" and not ":-". The difference is not cosmetic: with ":-" the default
      # is "admin", so starting the stack without .env leaves an admin/admin
      # Grafana listening on port 3000. With ":?" Compose ABORTS with a clear
      # error. Failing to start beats starting open.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in your .env (copy .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"        # no self sign-up
      GF_AUTH_ANONYMOUS_ENABLED: "false"     # never a public dashboard
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"    # no telemetry to Grafana Labs
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_LOG_LEVEL: warn
    volumes:
      # Only the subdirectories this repository manages: the image ships its own
      # access-control, alerting, notifiers and plugins directories, and
      # mounting the parent hides them, so Grafana logs a "no such file or
      # directory" for each one at startup.
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
