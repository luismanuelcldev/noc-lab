# Paneles. Aprovisionados desde los JSON del repositorio, nunca editados en la UI.
services:
  grafana:
    image: grafana/grafana:12.4.11
    container_name: noc-grafana
    extends:
      file: ./_base.yml
      service: default
    networks: [edge, mesh]
    ports:
      - "${NOC_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # ":?" y no ":-": con ":-" el valor por defecto es "admin", asi que arrancar
      # sin .env deja un Grafana admin/admin escuchando en el 3000. Con ":?" Compose
      # ABORTA con un error claro. Fallar al arrancar es mejor que arrancar abierto.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in your .env (copy .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"        # sin autorregistro
      GF_AUTH_ANONYMOUS_ENABLED: "false"     # nunca un panel publico
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"    # sin telemetria a Grafana Labs
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_LOG_LEVEL: warn
    volumes:
      # Solo los subdirectorios que gestiona este repositorio: la imagen trae sus
      # propios directorios de control de acceso, alertas, notificadores y plugins,
      # y montar el padre los tapa, asi que Grafana registra un "no such file or
      # directory" por cada uno al arrancar.
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M