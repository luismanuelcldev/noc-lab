# Puente entre el webhook de Alertmanager y las notificaciones ntfy.
services:
  # Es el unico componente que guarda credenciales, asi que ningun otro servicio
  # necesita conocerlas. Solo biblioteca estandar: sin framework web ni etapa de
  # build, y una imagen de ~70 MB.
  ntfy-bridge:
    build:
      context: ../ntfy-bridge
      dockerfile: Dockerfile
    image: mi-noc/ntfy-bridge:1.0.0
    container_name: noc-ntfy-bridge
    extends:
      file: ./_base.yml
      service: default
    networks: [mesh]
    environment:
      NTFY_URL: ${NTFY_URL:-http://ntfy:80}
      NTFY_TOPIC: ${NTFY_TOPIC:-noc-alerts}
      # Token primero, y luego usuario/contrasena para ntfy con login activado.
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_USER: ${NTFY_USER:-}
      NTFY_PASSWORD: ${NTFY_PASSWORD:-}
      # Token que el puente exige en la cabecera Authorization. Vacio = sin auth,
      # que es lo que espera un Alertmanager sin token: no expande variables, asi
      # que uno real tendria que escribirse a mano. Ver docs/SECURITY.md.
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    read_only: true                 # la app nunca escribe en disco
    tmpfs:
      - /tmp:size=16M
    cap_drop:
      - ALL
    # security_opt se hereda de _base.yml: repetirlo aqui lo duplicaria y Compose rechaza la lista.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    restart: unless-stopped