# ===========================================================================
#  SCRAPE - sondas sinteticas a traves de blackbox_exporter
# ===========================================================================
#  Validar:  promtool check config prometheus.yml
#
#  El patron "probe": Prometheus NO llama al objetivo; delega en la sonda y
#  reetiqueta la respuesta. __param_target conserva el destino real y __address__
#  pasa a ser blackbox-exporter, de forma que instance sigue siendo
#  http://target:80 y cada alerta llega con su propia identidad.
# ===========================================================================

scrape_configs:
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_canary]         # ver blackbox.yml
    static_configs:
      - targets:
          - "http://demo-app:80"
        labels:
          # service es OBLIGATORIA: alimenta el enrutado por equipo de Alertmanager y
          # sin ella la alerta llega sin asignar.
          service: "web-frontal"
          component: "application"
          team: "backend"
          environment: "lab"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP responde a "se aceptan conexiones?" incluso con la aplicacion de detras
  # fallando: es la primera capa de diagnostico de un servicio.
  - job_name: "blackbox-tcp"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["demo-app:80"]
        labels:
          service: "web-frontal"
          component: "application"
          team: "backend"
          environment: "lab"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # En produccion los objetivos cambian con cada despliegue; mantenerlos en YAML
  # que Prometheus relee solo (file_sd) es la diferencia entre mantener el stack y
  # mantenerlo en escala.
  # El glob es ../targets/*.yml porque las rutas de file_sd se resuelven contra el
  # directorio de ESTE fichero: escrito como targets/*.yml no coincidia con nada y
  # promtool solo lo decia en un aviso, con el trabajo sano y cero objetivos.
  - job_name: "blackbox-dinamico"
    metrics_path: /probe
    params:
      module: [http_canary]
    file_sd_configs:
      - files: ["../targets/*.yml"]
        refresh_interval: 60s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [team]        # arrastra las etiquetas del fichero de inventario
        target_label: team
      - source_labels: [service]
        target_label: service
      - target_label: __address__
        replacement: blackbox-exporter:9115