# ===========================================================================
#  SCRAPE - el centro de monitorizacion observandose a si mismo
# ===========================================================================
#  Validar:  promtool check config prometheus.yml
#  Prometheus, Alertmanager y el puente: los tres componentes que tienen que estar
#  sanos para que los demas trabajos del laboratorio valgan algo.
# ===========================================================================

scrape_configs:
  # Sin este scrape no hay forma de saber que el scrape esta roto: un Prometheus
  # muerto produce silencio, y el silencio no es un estado detectable.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: "monitoring"

  # Hace que los fallos de entrega de notificaciones disparen alerta: sin el, un
  # canal de notificacion muerto es un fallo silencioso.
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          component: "monitoring"

  # Sin este scrape, un canal de alerta roto solo se ve como silencio. La serie
  # ntfy_bridge_delivery_success alimenta la alerta CanalNotificacionCaido.
  #
  # aqui NO hay metric_relabel_configs, A PROPOSITO. Una version anterior
  # descartaba ntfy_bridge_delivery_duration_seconds_(sum|count|avg) por "alta
  # cardinalidad" y el panel que consulta sum/count se quedo en blanco para
  # siempre. Una serie descartada es indistinguible de una metrica que dejo de
  # producirse, y esas familias son el contrato publico del puente con los
  # paneles: no las filtres sin comprobar antes las consultas de los dashboards.
  - job_name: "ntfy-bridge"
    static_configs:
      - targets: ["ntfy-bridge:5000"]
        labels:
          service: "notificaciones"
          component: "monitoring"