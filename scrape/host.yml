# ===========================================================================
#  SCRAPE - el host que hospeda el laboratorio
# ===========================================================================
#  Validar:  promtool check config prometheus.yml
# ===========================================================================

scrape_configs:
  - job_name: "node"
    # 30s y no menos: el host cambia despacio y 15s seria de sobra.
    scrape_interval: 30s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: "host"
    metric_relabel_configs:
      # Control de cardinalidad: el TSDB se degrada por numero de series y ademas se
      # factura por ellas, y un exportador sin filtrar las multiplica por diez.
      - source_labels: [__name__]
        regex: "node_(cgroup|meminfo|vmstat)_.*"   # detalle de Linux de poco valor para un NOC
        action: "drop"
      - source_labels: [__name__]
        regex: "node_netstat_.*_(errors|dropped)"   # los contadores agregados si importan
        action: "drop"