# BLACKBOX EXPORTER - modulos de sonda.
#
# Cada modulo define COMO se sondea algo; Prometheus decide QUE se sondea con el
# parametro "module" de cada trabajo (ver scrape/sondas.yml).
# Validar: docker compose exec blackbox-exporter wget -qO- localhost:9115/config

modules:

  # La mas valiosa de las tres y la que casi nadie configura: una sonda que solo mira
  # "devuelve 200" no basta, porque una pagina de mantenimiento devuelve 200, un
  # balanceador puede devolver el portal cautivo y una app con la base de datos caida
  # sigue devolviendo 200 con el cuerpo vacio. El regexp la convierte en una
  # comprobacion de verdad: el puerto responde Y el contenido es el esperado.
  http_canary:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]        # cualquier otro codigo => probe_success = 0
      follow_redirects: true
      preferred_ip_protocol: ip4        # evita IPv6 donde no hay ruta IPv6
      ip_protocol_fallback: true
      headers:
        User-Agent: "mi-noc-blackbox/1.0 (laboratorio de observabilidad)"
      body_size_limit: 64KB             # techo: un cuerpo enorme no aporta nada
      fail_if_body_not_matches_regexp:
        - "noc-canary-ok"              # texto que DEBE aparecer en la respuesta

  # Solo el codigo de estado: mas simple y con menos falsos positivos, la opcion
  # correcta cuando el contenido es dinamico y no se le puede anclar texto estable.
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  # Capa 4: responde solo a "el puerto acepta conexiones?", nada sobre la app. Es la
  # PRIMERA comprobacion de un diagnostico: si TCP falla no hay nada que mirar encima.
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  # En produccion el DNS es un punto de fallo frecuente y de impacto amplio, asi que
  # se merece su propia sonda.
  dns:
    prober: dns
    timeout: 5s
    dns:
      # El campo es "query_name" y es obligatorio: si falta, el exportador aborta al
      # arrancar sin exportar nada, y con un nombre obsoleto el error no es legible
      # ("field query not found in type config.plain"). El esquema de este modulo ha
      # cambiado varias veces: comprueba la forma exacta contra la version en uso.
      query_name: demo-app              # interna: no sale a Internet
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      transport_protocol: "udp"
      recursion_desired: true
      valid_rcodes: ["NOERROR"]
      # Para comprobar ADEMAS que la IP resuelta es la correcta. Desde v0.28.0 son
      # listas de reglas, no el antiguo "preferred_rr":
      #   validate_answer_rrs:
      #     fail_if_none_matches_regexp: ["10\\.20\\.30\\.40"]

# Este modulo existe pero NO se sondea en el lab. Activarlo necesita dos pasos: un
# job con "module: [dns]" en scrape/sondas.yml Y anadir "blackbox-dns" a la lista de
# jobs de la alerta TargetCaido en rules/metaservicio.rules.yml. El segundo es el que
# se olvida, y sin el un fallo de DNS no genera alerta alguna porque up sigue en 1.