# ===========================================================================
#  PROMETHEUS - configuracion principal
# ===========================================================================
#  Validar:  promtool check config prometheus.yml
#
#  Los trabajos de scrape no estan aqui: Prometheus los lee de scrape/*.yml
#  (scrape_config_files), uno por dominio, para que este fichero siga siendo lo
#  bastante corto para leerse de un vistazo y cada trabajo este junto al razonamiento
#  que hay detras.
# ===========================================================================

global:
  # 15s es el valor por defecto recomendado oficialmente: por debajo, la cardinalidad
  # y la carga suben sin comprarle a un NOC resolucion temporal util.
  scrape_interval: 15s
  scrape_timeout: 10s              # debe quedar POR DEBAJO de scrape_interval
  evaluation_interval: 15s

  # Las external labels se anaden a toda alerta reenviada a Alertmanager y son lo que
  # permite que un solo Alertmanager mantenga los entornos separados. Sus dos valores
  # son marcadores a proposito, porque Prometheus no expande variables de entorno: el
  # entrypoint los sustituye antes del arranque. Ver docs/OPERATIONS.md.
  external_labels:
    monitor: "${NOC_MONITOR_NAME}"
    environment: "${NOC_ENVIRONMENT}"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      # Cuanto espera Prometheus la confirmacion de entrega de un lote de alertas. Si
      # el puente va lento y se pasa del plazo, Alertmanager reintenta: comportamiento
      # previsto, no un fallo.
      timeout: 10s
      api_version: v2

# Un glob por dominio, para que anadir un modulo no obligue a tocar esta lista: el
# error clasico es una regla nueva en un fichero que nadie anadio a rule_files, que se
# carga sin avisar y no existe.
rule_files:
  - "rules/*.yml"

# Mismo criterio que en rule_files, y el mismo error si se olvida: un fichero de
# scrape que nadie anadio a la lista se carga sin avisar ni existir.
scrape_config_files:
  - "scrape/monitoreo.yml"
  - "scrape/host.yml"
  - "scrape/contenedores.yml"
  - "scrape/sondas.yml"