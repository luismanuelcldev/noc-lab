# ===========================================================================
#  Actualizaciones de dependencias
# ===========================================================================
#  Las versiones se fijan exactas a proposito: el momento en que acaba un despliegue
#  no es el momento de enterarse de que una version mayor cambio un comportamiento.
#  Dependabot abre el cambio, la CI lo comprueba y la decision es de quien lo lee.
#  Lo mas importante son las imagenes Docker, fijadas por etiqueta y por digest: un
#  "latest" que se mueve solo cambia el comportamiento sin que nadie lo decida. Python
#  va con versiones exactas y las acciones de la CI con una etiqueta mayor, lo habitual.
# ===========================================================================
version: 2

updates:
  # Imagenes de los servicios del stack. Lo que mas importa es la agrupacion: cada
  # entrada es hoy una version que no se mueve sola.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    labels:
      - dependencias
      - docker
    commit-message:
      prefix: "docker"
    groups:
      # Prometheus, Alertmanager y node-exporter vienen del mismo proyecto y salen
      # juntos: agruparlos evita tres cambios que hay que revisar en bloque.
      prometheus:
        patterns:
          - "prom/prometheus"
          - "prom/alertmanager"
          - "prom/node-exporter"
          - "prom/blackbox-exporter"
      grafana:
        patterns:
          - "grafana/grafana"
      # ntfy y cAdvisor no son del proyecto y no forman parte del ecosistema de
      # Prometheus: ntfy publica a menudo y cAdvisor va por detras de la version de
      # Kubernetes, asi que conviene revisarlos aparte.
      otros:
        patterns:
          - "binwiederhier/ntfy"
          - "gcr.io/cadvisor/cadvisor"
          - "nginx"

    # mi-noc/ntfy-bridge se deja sin grupo a proposito: la imagen se construye desde
    # ./ntfy-bridge con su propio Dockerfile, no se tira de un registro y no hay version
    # que seguir. Lo que si se actualiza son sus dependencias de Python.

  - package-ecosystem: pip
    directories:
      - /ntfy-bridge
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    labels:
      - dependencias
      - python
    commit-message:
      prefix: "python"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencias
      - ci
    commit-message:
      prefix: "ci"
