# ===========================================================================
#  INVENTARIO DINAMICO DE OBJETIVOS (file_sd)
# ===========================================================================
#  Prometheus relee este fichero cada 60s (refresh_interval, en scrape/sondas.yml)
#  sin necesidad de reiniciar. Anadir un objetivo significa editar este YAML.
#
#  Este fichero es el "inventario" del laboratorio: simula el catalogo de servicios
#  que en produccion vendrian del CMDB, de un portal de autoservicio o de un
#  sistema de gestion de cambios.
#
#  Etiquetas disponibles y su significado:
#    service      -> nombre del servicio. OBLIGATORIA: sin ella el enrutado de
#                    Alertmanager por equipo no funciona.
#    team         -> equipo responsable
#    environment  -> entorno (lab / preprod / prod)
#    tier         -> criticidad del servicio (1 = la mas critica)
#    __address__  -> lo sustituye el relabeling de sondas.yml por la sonda
#    instance     -> la fija el relabeling; identidad legible en la alerta
# ===========================================================================

- targets: ["http://demo-app:80"]
  labels:
    service: "web-frontal"
    team: "backend"
    environment: "lab"
    tier: "1"