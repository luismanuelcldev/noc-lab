# Tests de regresión de contenedores: división por cero, conteo de reinicios y etiquetas.
# Ejecutar: promtool test rules test/rules-contenedores.test.yml
#
# SEMÁNTICA DE promtool QUE AFECTA A ESTOS TESTS:
#   * Las rutas de rule_files se resuelven desde la UBICACIÓN de este fichero, por eso
#     el "../". Y falla en silencio de verdad: si la ruta está mal, promtool carga CERO
#     reglas, todos los "exp_alerts: []" negativos pasan por el motivo equivocado y el
#     fichero entero parece correcto. Si dudas, comprueba que no sale un WARNING de
#     "no file match pattern".
#   * exp_labels y exp_annotations se comparan como CONJUNTOS COMPLETOS, no subconjuntos:
#     si la alerta produce una etiqueta o anotación que el test no lista, falla. Por eso
#     cada caso positivo lista las cuatro anotaciones, lo que además deja verificado y
#     documentado el contrato de la alerta (texto, runbook, dashboard).
#   * Etiquetas que sobreviven y que conviene recordar: las uniones "sum by (name)" y
#     "on(name)" DESCARTAN el resto, job incluido. Por eso ContenedorUsoMemoriaAlto no
#     lleva job y ContenedorReiniciado sí. Es correcto, no un descuido.
rule_files:
  - ../rules/*.yml

evaluation_interval: 1m

tests:
  # REGRESIÓN del fallo más caro del stack. Sin el filtro "> 0" en el denominador,
  # working_set / 0 = +Inf y +Inf > 90 es siempre cierto, así que toda alerta de
  # contenedor quedaba permanentemente disparada. Un contenedor SIN límite no es
  # expresable como porcentaje, y lo correcto es que no entre en la regla.
  - name: "ContenedorUsoMemoriaAlto REGRESIÓN: un contenedor sin límite NO dispara"
    interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{job="cadvisor", name="prometheus"}'
        values: '500000000x20'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor", name="prometheus"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContenedorUsoMemoriaAlto
        exp_alerts: []

  - name: "ContenedorUsoMemoriaAlto: 95% de un límite asignado dispara"
    interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{job="cadvisor", name="prometheus"}'
        values: '950000000x20'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor", name="prometheus"}'
        values: '1000000000x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: ContenedorUsoMemoriaAlto
        exp_alerts:
          - exp_labels: {severity: warning, service: prometheus, name: prometheus}
            exp_annotations:
              summary: "El contenedor prometheus está al 95.0% de su límite de memoria"
              description: "Working set por encima del 90% del límite asignado. Pasado el 100% el kernel lo mata de inmediato (OOM kill)."
              runbook_url: "https://github.com/luismanuelcldev/noc-lab/blob/main/docs/RUNBOOK.md#contenedor-memoria-alto"
              dashboard_url: "http://localhost:3000/d/noc-contenedores-resumen"

  # REGRESIÓN del método de conteo, por los dos lados. container_last_seen NO es un
  # contador: es un reloj que avanza mientras el contenedor vive, así que el increase()
  # da ~0 y la versión anterior de esta regla no detectaba ni un solo reinicio. Era
  # decoración que PARECÍA funcionar. Este test fija que un arranque no dispara y dos sí,
  # que es la firma de un bucle de fallos.
  - name: "ContenedorReiniciado REGRESIÓN: un solo arranque no dispara"
    interval: 1m
    input_series:
      - series: 'container_start_time_seconds{job="cadvisor", name="grafana"}'
        values: '1000 1000 1000 2000 2000 2000 2000 2000 2000 2000 1000 2000 2000 2000'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContenedorReiniciado
        exp_alerts: []

  - name: "ContenedorReiniciado: dos arranques en 10m disparan (bucle de fallos)"
    interval: 1m
    input_series:
      - series: 'container_start_time_seconds{job="cadvisor", name="grafana"}'
        values: '1000 1000 1000 2000 2000 2000 3000 3000 3000 3000 3000 3000 3000 3000'
    alert_rule_test:
      - eval_time: 7m
        alertname: ContenedorReiniciado
        exp_alerts: []
      - eval_time: 8m
        alertname: ContenedorReiniciado
        exp_alerts:
          - exp_labels: {severity: warning, service: grafana, job: cadvisor, name: grafana}
            exp_annotations:
              summary: "El contenedor grafana se reinició varias veces en 10 minutos"
              description: "Dos o más arranques en 10 minutos. Síntoma clásico de bucle de fallos: la causa suele estar en el log del contenedor, no en los recursos."
              runbook_url: "https://github.com/luismanuelcldev/noc-lab/blob/main/docs/RUNBOOK.md#contenedor-reiniciado"
              dashboard_url: "http://localhost:3000/d/noc-contenedores-detalle"
