# Tests de regresión de las recording rules: la etiqueta correcta y la duplicación de cAdvisor.
# Ejecutar: promtool test rules test/rules-recording.test.yml
#
# SEMÁNTICA DE promtool QUE AFECTA A ESTOS TESTS: la común de todos los ficheros de
# test/, documentada entera en test/rules-metaservicio.test.yml. Aquí estos tests usan
# promql_expr_test, no alert_rule_test: comprueban el VALOR de la serie grabada, no si
# una alerta dispara. Es la única forma de fijar una recording rule, porque una
# recording rule correcta no dispara nada por definición.
rule_files:
  - ../rules/*.yml

evaluation_interval: 1m

tests:
  # Las recording rules usaban container_name, la etiqueta que cAdvisor no publica. Sin
  # error: la serie se grababa vacía y los paneles que la consumen decían "no data" sin
  # explicación. Este test falla si alguien vuelve a cambiar name por container_name.
  # Ojo: "sum by (name)" descarta el resto de etiquetas, job incluido, y por eso la
  # expresión no filtra por job=...: la serie grabada no tiene job.
  - name: "REGRESIÓN recording: noc_contenedor_cpu_nucleos usa la etiqueta name"
    interval: 1m
    input_series:
      - series: 'container_cpu_usage_seconds_total{job="cadvisor", name="grafana"}'
        values: '0+30x20'
    promql_expr_test:
      - expr: 'noc_contenedor_cpu_nucleos'
        eval_time: 10m
        exp_samples:
          - labels: 'noc_contenedor_cpu_nucleos{name="grafana"}'
            value: 0.5

  # cAdvisor v0.55.1 con Docker 29 a veces emite el MISMO contenedor dos veces con
  # conjuntos de etiquetas distintos: mismo id, una serie con container_label_restartcount
  # y otra sin. Con dos series compartiendo name, "on(name)" pasa a ser muchos-a-muchos,
  # Prometheus aborta la evaluación y la regla no graba NADA: no es un problema de un
  # contenedor, el panel entero queda vacío.
  #
  # Este test inyecta esa duplicación a propósito. Con "max by (name)" en ambos lados la
  # regla sigue evaluando. Si alguien quita esa agregación, el test falla con
  # "many-to-many matching not allowed", el síntoma exacto visto en producción.
  - name: "REGRESIÓN recording: memoria_porcentaje sobrevive a un contenedor duplicado por cAdvisor"
    interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{job="cadvisor", name="grafana", id="/docker/aaa"}'
        values: '250000000x20'
      - series: 'container_memory_working_set_bytes{job="cadvisor", name="grafana", id="/docker/aaa", container_label_restartcount="3"}'
        values: '250000000x20'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor", name="grafana", id="/docker/aaa"}'
        values: '1000000000x20'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor", name="grafana", id="/docker/aaa", container_label_restartcount="3"}'
        values: '1000000000x20'
    promql_expr_test:
      - expr: 'noc_contenedor_memoria_porcentaje'
        eval_time: 10m
        exp_samples:
          - labels: 'noc_contenedor_memoria_porcentaje{name="grafana"}'
            value: 25
